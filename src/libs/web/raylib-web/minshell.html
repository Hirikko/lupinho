<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Lupinho Core</title>
    <meta name="viewport" content="width=device-width">
    <link rel="shortcut icon" href="https://www.raylib.com/favicon.ico">

    <style>
        body { margin: 0px; overflow: hidden; background-color: black; }
        canvas.emscripten { border: 0px none; background-color: black; width: 100%; height: 100%; display: block; }
    </style>
    <script type='text/javascript' src="https://cdn.jsdelivr.net/gh/eligrey/FileSaver.js/dist/FileSaver.min.js"> </script>
    <script type='text/javascript'>
        function saveFileFromMEMFSToDisk(memoryFSname, localFSname) {
            var isSafari = false;
            var data = FS.readFile(memoryFSname);
            var blob;
            if (isSafari) blob = new Blob([data.buffer], { type: "application/octet-stream" });
            else blob = new Blob([data.buffer], { type: "application/octet-binary" });
            saveAs(blob, localFSname);
        }
    </script>
  </head>
  <body>
    <canvas class=emscripten id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas>
    <p id="output" style="display: none;"></p>
    <script>
        var Module = {
            print: (function() {
                var element = document.getElementById('output');
                if (element) element.value = '';
                return function(text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                    if (element) {
                      element.value += text + "\n";
                      element.scrollTop = element.scrollHeight;
                    }
                };
            })(),
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.style.imageRendering = "pixelated";
                canvas.style.msInterpolationMode = "nearest-neighbor";
                return canvas;
            })()
        };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
